# nginx for the FS Review web app, inside the container on port 8080. It serves the built app and passes /api to
# the api container, so the app and the api share one origin (api/docs/OPERATIONS.md section 3). TLS is ended
# by the host or a proxy in front of this container. Security headers follow OPERATIONS.md section 4.

# keep the scheme a proxy in front reports (https), or use this connection's own
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # largest bodies the api accepts: review reports 50 MB, OCR pages 40 MB, documents and evidence 25 MB
  client_max_body_size 55m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # OCR reads scanned pages one at a time, up to 90 seconds each
    proxy_read_timeout 600s;
  }

  # live updates: a Server-Sent Events stream, never buffered and kept open well past the api's 60-second check
  location = /api/events {
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
    expires epoch;
    # report-only until every screen has been opened as each role with no violations; then rename the header
    # to Content-Security-Policy to enforce it (OPERATIONS.md section 4)
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Vite's hashed file names never change content, so they can be cached for good
    location /assets/ {
      expires max;
    }
  }
}
